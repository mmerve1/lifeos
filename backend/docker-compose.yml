services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos_db
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos_dev_password
    ports:
      - "5433:5432"
    volumes:
      - lifeos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lifeos_pgdata:
